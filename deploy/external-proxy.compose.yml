# Apply after docker-compose.yml. Requires Docker Compose 2.24.4 or later.
# This example owns a separate external TLS gateway; do not combine it with
# another listener on the same public ports.
services:
  caddy:
    image: "${COMPOSE_PROJECT_NAME:-psst}-web"
    ports: !reset []
    environment:
      PSST_DOMAIN: "http://${PSST_DOMAIN:?Set PSST_DOMAIN to your public hostname}"
      PSST_EXTERNAL_PROXY_CIDRS: "${PSST_EXTERNAL_PROXY_IP:-172.30.194.2}/32"
    volumes:
      - ./deploy/external-proxy/trusted-proxy.caddy:/etc/caddy/proxy-trust/external.caddy:ro
    networks: !override
      private:
        ipv4_address: ${PSST_PROXY_IP:-172.30.193.3}
      proxy:
        ipv4_address: ${PSST_WEB_PROXY_IP:-172.30.194.3}

  external-proxy:
    extends:
      file: docker-compose.yml
      service: caddy
    image: "${COMPOSE_PROJECT_NAME:-psst}-web"
    volumes:
      - ./deploy/external-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - external-proxy-data:/data
      - external-proxy-config:/config
    depends_on:
      - caddy
    networks: !override
      proxy:
        ipv4_address: ${PSST_EXTERNAL_PROXY_IP:-172.30.194.2}
      edge:

networks:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PSST_EXTERNAL_PROXY_SUBNET:-172.30.194.0/29}

volumes:
  external-proxy-data:
  external-proxy-config:
