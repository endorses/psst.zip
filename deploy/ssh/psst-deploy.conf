# Install root-owned at /etc/ssh/sshd_config.d/70-psst-deploy.conf.
# Validate the effective Match configuration before reloading sshd.
Match User psst-deploy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/psst-deploy/authorized_keys
    ForceCommand /usr/bin/sudo -n /usr/bin/python3 -I /usr/local/lib/psst.zip/deploy/update.py ssh
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
Match all
