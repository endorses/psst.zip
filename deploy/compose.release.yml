# Requires Docker Compose 2.24.4 or later. Use a verified release manifest.
# Image references must be registry paths with @sha256: manifest-index digests.
name: ${COMPOSE_PROJECT_NAME:-psst-zip}

services:
  backend:
    image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE to the released backend image digest}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_CPU_LIMIT:-2}
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LISTEN_ADDR: ":8080"
      STORAGE_PATH: /app/data/files
      DB_PATH: "${DB_PATH:-/app/data/psst.db}"
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-5368709120}"
      DEFAULT_EXPIRY: "${DEFAULT_EXPIRY:-24h}"
      CLEANUP_INTERVAL: "${CLEANUP_INTERVAL:-5m}"
      ALLOW_LEGACY_DELETION: "${ALLOW_LEGACY_DELETION:-false}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      AUTH_ALLOW_INSECURE_HTTP: "${AUTH_ALLOW_INSECURE_HTTP:-false}"
      MAX_SLOT_TRANSFERS: "${MAX_SLOT_TRANSFERS:-20}"
      MAX_SLOT_SIZE: "${MAX_SLOT_SIZE:-5368709120}"
      MAX_SLOT_EXPIRY: "${MAX_SLOT_EXPIRY:-168h}"
      TRUSTED_PROXIES: "${PSST_PROXY_IP:-172.30.193.3}/32"
    volumes:
      - psst-data:/app/data
    networks:
      private:
        ipv4_address: ${PSST_BACKEND_IP:-172.30.193.2}

  caddy:
    image: "${WEB_IMAGE:?Set WEB_IMAGE to the released web image digest}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${PROXY_MEMORY_LIMIT:-256m}
    cpus: ${PROXY_CPU_LIMIT:-1}
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      PSST_DOMAIN: "${PSST_DOMAIN:?Set PSST_DOMAIN to your public hostname; see release.env.example}"
      CADDY_HTTP_PORT: "8080"
      CADDY_HTTPS_PORT: "8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      private:
        ipv4_address: ${PSST_PROXY_IP:-172.30.193.3}
      edge:

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${PSST_PRIVATE_SUBNET:-172.30.193.0/29}
  edge:

volumes:
  psst-data:
    name: ${BACKEND_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-psst-zip}_psst-data}
  caddy-data:
    name: ${CADDY_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-psst-zip}_caddy-data}
  caddy-config:
    name: ${CADDY_CONFIG_VOLUME:-${COMPOSE_PROJECT_NAME:-psst-zip}_caddy-config}
