name: Psst
options:
  bundleIdPrefix: zip.psst
  developmentLanguage: en
  knownRegions: [en, de]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
targetTemplates:
  SharedFramework:
    platform: iOS
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./android/gradlew -p shared embedAndSignAppleFrameworkForXcode
    sources:
      - path: Shared
targets:
  Psst:
    templates: [SharedFramework]
    type: application
    sources:
      - path: Psst
        excludes: [Info.plist, Psst.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zip.psst.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Psst/Info.plist
        CODE_SIGN_ENTITLEMENTS: Psst/Psst.entitlements
    dependencies:
      - target: PsstShareExtension
        embed: true
  PsstShareExtension:
    templates: [SharedFramework]
    type: app-extension
    sources:
      - path: PsstShareExtension
        excludes: [Info.plist, PsstShareExtension.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zip.psst.ios.share-extension
        INFOPLIST_FILE: PsstShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PsstShareExtension/PsstShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  PsstTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PsstTests
      - path: ../docs/testing/fixtures/history-sync-v1.json
        buildPhase: resources
      - path: ../docs/security/fixtures/hpke-receive-v2.json
        buildPhase: resources
    dependencies:
      - target: Psst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zip.psst.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Psst:
    build:
      targets:
        Psst: all
    test:
      targets:
        - PsstTests
