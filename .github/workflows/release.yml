# Native release verification and explicitly enabled container publication.
# Planned main dispatches remain unsigned, read-only candidates. Exact version-tag
# attempts can publish only after authenticated checks and one protected approval;
# registry/release writes are disabled until the repository opt-in is configured.
# This workflow has no production access.
name: Container release verification and publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      planned_version:
        description: Unused planned version for a main-only candidate; does not create a release tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: container-release-publication
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate source identity and main ancestry
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      source_kind: ${{ steps.tag.outputs.source_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      - name: Require an exact version tag or unused planned version from main
        id: tag
        env:
          PLANNED_VERSION: ${{ inputs.planned_version }}
        run: |
          release_tool=$(sh tools/release/build.sh)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            "$release_tool" --root . container-build validate-source \
              --ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
              --planned-version "$PLANNED_VERSION" --github-output "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            "$release_tool" --root . container-build validate-tag \
              --ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
            # Validate the same push identity the publication signer requires,
            # before source CI, native preparation and protected reviews.
            "$release_tool" github tag-event --file "$GITHUB_EVENT_PATH" \
              --repository "$GITHUB_REPOSITORY" --version "${GITHUB_REF#refs/tags/}" --revision "$GITHUB_SHA"
          else
            printf '%s\n' 'Unsupported candidate trigger' >&2
            exit 1
          fi

  ci:
    name: Exact tagged commit CI
    needs: validate-tag
    # The reusable workflow comes from the exact caller commit. A main dispatch
    # can exercise native preparation but cannot satisfy tagged source-CI gates.
    # Security, backend and web must succeed; mobile validation stays in routine CI.
    # An old successful run is insufficient.
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true
      container_release: true
    permissions:
      contents: read

  resolve-bases:
    name: Resolve immutable bases and audit the common npm lock
    needs: validate-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      golang_image: ${{ steps.bases.outputs.golang_image }}
      alpine_image: ${{ steps.bases.outputs.alpine_image }}
      node_image: ${{ steps.bases.outputs.node_image }}
      caddy_image: ${{ steps.bases.outputs.caddy_image }}
      buildkit_image: ${{ steps.bases.outputs.buildkit_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      - name: Resolve once and verify immutable index architecture coverage
        id: bases
        env:
          CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" container-build resolve-bases \
            --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/candidate-bases.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Attest the exact immutable base resolution for this tag attempt
        id: bases-attestation
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate-bases.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Audit the exact npm lock once for both architecture builds
        env:
          CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
          NODE_IMAGE: ${{ steps.bases.outputs.node_image }}
        run: |
          tool=$(sh tools/release/build.sh)
          "$tool" scan npm --repository "$GITHUB_REPOSITORY" \
            --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
            --node-image "$NODE_IMAGE" --output "$RUNNER_TEMP/common-npm-audit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-common-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-npm-audit/
          if-no-files-found: error
          retention-days: 1
      - name: Remove the owned common npm audit copy
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/common-npm-audit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-bases-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bases-attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-bases.json
          if-no-files-found: error
          retention-days: 1

  upstream-inputs:
    name: Retain common upstream source inputs
    needs: validate-tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      - name: Collect immutable originals against the exact catalog and web lock
        env:
          CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" --root . sources common collect \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/candidate-upstream"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-upstream-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-upstream/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove the owned common original collection
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/candidate-upstream"

  build-and-smoke:
    name: Native backend/web images (${{ matrix.arch }})
    # Preparation can overlap source CI; assembly below still requires CI success.
    needs: [validate-tag, resolve-bases, upstream-inputs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
            cosign_sha256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cosign_sha256: 426193b4c5da4d4d643e822f48fe0cc8a476ca1782a272704831f5a0cef716d7
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Source collection and exact-image compiler graphs are release preparation;
    # ordinary source CI keeps its existing, separate budgets.
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
      SOURCE_KIND: ${{ needs.validate-tag.outputs.source_kind }}
      GO_IMAGE: ${{ needs.resolve-bases.outputs.golang_image }}
      RUNTIME_IMAGE: ${{ needs.resolve-bases.outputs.alpine_image }}
      NODE_IMAGE: ${{ needs.resolve-bases.outputs.node_image }}
      CADDY_IMAGE: ${{ needs.resolve-bases.outputs.caddy_image }}
      # Replay the signed upstream Caddy binary with its actual Go producer.
      # This inspection compiler does not build the application or replace GO_IMAGE.
      CADDY_GO_IMAGE: docker.io/library/golang@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c
      COSIGN_SHA256: ${{ matrix.cosign_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      # Native source measurement addresses exact config blobs. Keep that store
      # contract explicit on this disposable daemon, without changing VPS storage.
      - name: Set up the native measurement Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.8.2
          channel: stable
          set-host: true
          daemon-config: |
            {
              "storage-driver": "overlay2",
              "features": {"containerd-snapshotter": false}
            }
      - name: Verify the native measurement Docker engine
        run: |
          # DOCKER_HOST binds the virtual default context and default Buildx
          # builder to the action's isolated socket, including later overlays.
          test -n "$DOCKER_HOST"
          docker context use default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = "$DOCKER_HOST"
          test "$(docker version --format '{{.Server.Version}}')" = '29.8.2'
          test "$(docker info --format '{{.Driver}}')" = 'overlay2'
          architecture="$(docker info --format '{{.Architecture}}')"
          case "$architecture" in
            x86_64) architecture=amd64 ;;
            aarch64) architecture=arm64 ;;
          esac
          test "$PLATFORM" = "linux/$architecture"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-common-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-npm-audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-upstream-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-upstream
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=${{ needs.resolve-bases.outputs.buildkit_image }}
      - name: Build original native pair using the shared immutable bases
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          install -d -m 700 "$private" "$private/tools"
          # Local builds retain metadata, not registry attestations or release provenance.
          docker buildx build --platform "$PLATFORM" --load --provenance=false --sbom=false \
            --metadata-file "$private/backend-build.json" \
            --tag "psst-candidate-backend:$ARCH" \
            --build-arg "GO_IMAGE=$GO_IMAGE" --build-arg "RUNTIME_IMAGE=$RUNTIME_IMAGE" \
            --build-arg "VERSION=$CANDIDATE_VERSION" --build-arg "REVISION=$SOURCE_COMMIT" \
            --file backend/Dockerfile backend
          docker buildx build --platform "$PLATFORM" --load --provenance=false --sbom=false \
            --metadata-file "$private/web-build.json" \
            --tag "psst-candidate-web:$ARCH" \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "CADDY_IMAGE=$CADDY_IMAGE" \
            --build-arg "VERSION=$CANDIDATE_VERSION" --build-arg "REVISION=$SOURCE_COMMIT" \
            --file web/Dockerfile .
          # Retain the same cached web-build stage for its observed inputs. The
          # native verifier independently compares its outputs with final OCI
          # bytes; a matching revision label alone never establishes this link.
          docker buildx build --platform "$PLATFORM" --load --target web-build \
            --provenance=false --sbom=false \
            --metadata-file "$private/web-builder-build.json" \
            --tag "psst-candidate-web-builder:$ARCH" \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "CADDY_IMAGE=$CADDY_IMAGE" \
            --build-arg "VERSION=$CANDIDATE_VERSION" --build-arg "REVISION=$SOURCE_COMMIT" \
            --file web/Dockerfile .
      - name: Prepare native source helper and verified official Cosign
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          # The selected container builder cannot resolve daemon-local image
          # aliases. Source helper and later overlays explicitly use default.
          docker buildx build --builder default --platform "$PLATFORM" --load \
            --provenance=false --sbom=false \
            --tag "psst-candidate-source-helper:$ARCH" --iidfile "$private/helper.id" \
            --build-arg "ALPINE_IMAGE=$RUNTIME_IMAGE" \
            --file tools/runtime-sources.Dockerfile tools
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --max-time 300 --max-filesize 268435456 \
            --output "$private/tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-$ARCH"
          printf '%s  %s\n' "$COSIGN_SHA256" "$private/tools/cosign" | sha256sum --check --strict
          chmod 700 "$private/tools/cosign"
          # A helper additionally verifies Cosign's exact release/commit/native
          # architecture before any upstream signature verification is trusted.
          cat > "$private/diagnose.py" <<'PY'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open('rb') as stream:
              stream.seek(max(0, path.stat().st_size - 65536))
              value = stream.read(65536).decode('utf-8', errors='replace')
          for name in ['GH_TOKEN', 'GITHUB_TOKEN', 'RUNNER_TEMP', 'GITHUB_WORKSPACE', 'HOME']:
              if os.environ.get(name):
                  value = value.replace(os.environ[name], '<' + name + '>')
          value = re.sub(r'[\x00-\x08\x0b-\x1f\x7f]', '?', value)
          # Prefix every line so external diagnostics cannot issue Actions commands.
          for line in value.splitlines():
              print('diagnostic: ' + line)
          PY
          cat > "$private/run-checked.sh" <<'SH'
          psst_checked() {
            local label="$1"
            shift
            if "$@" > "$private/$label.stdout" 2> "$private/$label.stderr"; then
              return 0
            else
              local status=$?
              python3 "$private/diagnose.py" "$private/$label.stderr"
              return "$status"
            fi
          }
          SH
      - name: Record authentic build metadata and original paired save
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          docker image save --output "$private/candidate-pair.tar" \
            "psst-candidate-backend:$ARCH" "psst-candidate-web:$ARCH"
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" container-build record-build \
            --candidate "$RUNNER_TEMP/candidate-inputs/candidate-bases.json" \
            --platform "$PLATFORM" \
            --backend-metadata "$private/backend-build.json" \
            --web-metadata "$private/web-build.json" \
            --archive "$private/candidate-pair.tar" \
            --output "$private/candidate-result.json"
      - name: Collect exact application dependency inputs privately
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          source "$private/run-checked.sh"
          # Collection needs only the exact Git locks and immutable Go builder;
          # its full scanner replay remains a later assembly prerequisite.
          release_tool=$(sh tools/release/build.sh)
          psst_checked dependency-inputs "$release_tool" --root "$GITHUB_WORKSPACE" sources modules collect \
            --repository "$GITHUB_REPOSITORY" \
            --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
            --platform "$PLATFORM" --go-image "$GO_IMAGE" \
            --output "$private/application-dependencies"
      - name: Prepare final native overlays, OCI exports and source/image measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          source "$private/run-checked.sh"
          psst_checked native-preparation python3 tools/prepare_native_release.py \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --platform "$PLATFORM" \
            --build-record "$private/candidate-result.json" \
            --original-archive "$private/candidate-pair.tar" \
            --helper-config "$(cat "$private/helper.id")" \
            --web-builder-config "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.config.digest"])' "$private/web-builder-build.json")" \
            --source-root "$GITHUB_WORKSPACE" \
            --common-collection "$RUNNER_TEMP/candidate-upstream" \
            --cosign "$private/tools/cosign" --output "$private/native"
      - name: Measure exact committed Go and browser source vulnerabilities
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          source "$private/run-checked.sh"
          release_tool=$(sh tools/release/build.sh)
          psst_checked source-scans "$release_tool" --root "$GITHUB_WORKSPACE" scan source \
            --repository "$GITHUB_REPOSITORY" \
            --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
            --platform "$PLATFORM" \
            --go-image "$GO_IMAGE" --node-image "$NODE_IMAGE" \
            --common-npm "$RUNNER_TEMP/common-npm-audit" \
            --output "$private/source-scans"
      - name: Authenticate native Trivy and measure every final-image finding
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          source "$private/run-checked.sh"
          release_tool=$(sh tools/release/build.sh)
          case "$ARCH" in
            amd64) trivy_asset=trivy_0.75.0_Linux-64bit.tar.gz ;;
            arm64) trivy_asset=trivy_0.75.0_Linux-ARM64.tar.gz ;;
            *) exit 1 ;;
          esac
          for suffix in '' .sigstore.json; do
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --max-time 300 --max-filesize 536870912 \
              "https://github.com/aquasecurity/trivy/releases/download/v0.75.0/$trivy_asset$suffix" \
              --output "$private/tools/$trivy_asset$suffix"
          done
          # Hashes are centralized in the reviewed producer, which additionally
          # checks the exact upstream workflow certificate, SCT/Rekor and binary
          # identity before execution. No installed system scanner is used.
          for component in backend web; do
            psst_checked "image-scan-$component" "$release_tool" --root "$GITHUB_WORKSPACE" scan image \
              --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
              --commit "$SOURCE_COMMIT" --platform "$PLATFORM" --component "$component" \
              --native-artifacts "$private/native/native-artifacts.json" \
              --archive "$private/native/export/$component-$ARCH.oci.tar" \
              --tool-archive "$private/tools/$trivy_asset" \
              --tool-bundle "$private/tools/$trivy_asset.sigstore.json" \
              --cosign "$private/tools/cosign" --output "$private/image-scan-$component"
          done
      - name: Measure compiler correspondence for final backend and Caddy executables
        run: |
          private="$RUNNER_TEMP/psst-native-private-$ARCH"
          source "$private/run-checked.sh"
          release_tool=$(sh tools/release/build.sh)
          for component in backend web; do
            # Gather actual Go advisory identifiers and aliases from every native
            # finding plus the source scan. This is evidence collection, not a
            # suppression policy: unmatched CVEs/OS/uncertain findings still fail
            # the later independent authenticated finding-disposition gate.
            extras=(--advisory-input "$private/image-scan-$component/measurement.json")
            compiler_image="$GO_IMAGE"
            if [ "$component" = web ]; then
              # The upstream OpenPGP advisory can be reported with a CVE alias.
              extras+=(--advisory-id GO-2026-5932 --cosign "$private/tools/cosign")
              compiler_image="$CADDY_GO_IMAGE"
            else
              extras+=(--advisory-input "$private/source-scans/source-scan-measurement.json")
            fi
            psst_checked "compiler-$component" "$release_tool" --root "$GITHUB_WORKSPACE" scan compiler \
              --repository "$GITHUB_REPOSITORY" \
              --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
              --platform "$PLATFORM" \
              --go-image "$compiler_image" --component "$component" \
              --collection "$private/native/pack" \
              --native-artifacts "$private/native/native-artifacts.json" \
              --archive "$private/native/export/$component-$ARCH.oci.tar" \
              --output "$private/compiler-$component" "${extras[@]}"
          done
      - name: Record completed native preparation status
        run: |
          printf '%s\n' \
            'Native candidate measurements completed; no registry or release was published.' \
            'Tagged runs attest completed measurements after transfer verification; planned main dispatches remain unsigned.' \
            'Image and source scans retain every finding; finding disposition, distribution review, public source retrieval, authenticated release gates and production rollout remain pending.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified native payloads and complete raw measurement inputs
        run: |
          install -d -m 700 "$RUNNER_TEMP/candidate-transfer"
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" container-build transfer collect \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --platform "$PLATFORM" --source-kind "$SOURCE_KIND" \
            --private "$RUNNER_TEMP/psst-native-private-$ARCH" \
            --output "$RUNNER_TEMP/candidate-transfer/$ARCH"
      - name: Attest exact native measurements for the version-tag attempt
        id: native-attestation
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Explicit small records. Their authenticated hashes bind all raw
          # graphs/source/capture/image bytes; no second build or archive signing.
          subject-path: |
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/candidate-transfer.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/native-artifacts.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/native-measurement.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/source-completeness-verification.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/browser/browser-verification.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/source-scans/source-scan-measurement.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/compiler-backend/compiler-graph-measurement.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/compiler-web/compiler-graph-measurement.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/image-scan-backend/measurement.json
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/image-scan-web/measurement.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-native-attestation-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Keep bundles outside the strictly allowlisted transfer trees.
          path: ${{ steps.native-attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-native-inputs-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Source/evidence contains no image saves. Upload each image payload
          # once below and join it at receiving boundaries before verification.
          path: |
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/
            !${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/final-images.docker.tar
            !${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/original/*.tar
            !${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/export/*.oci.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: ${{ needs.validate-tag.outputs.source_kind == 'version-tag' && 7 || 1 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-native-descriptor-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/native-artifacts.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-native-images-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          # OCI is consumed by assembly/publication and Docker save by the
          # existing recovery runner. Both have concrete consumers; neither
          # format is uploaded a second time inside source/evidence artifacts.
          path: |
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/final-images.docker.tar
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/original/*.tar
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/export/backend-${{ matrix.arch }}.oci.tar
            ${{ runner.temp }}/candidate-transfer/${{ matrix.arch }}/native/export/web-${{ matrix.arch }}.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.validate-tag.outputs.source_kind == 'version-tag' && 7 || 1 }}
      - name: Preserve bounded public records, excluding source/image payloads and diagnostics
        if: always()
        env:
          # Compare report contents with the actual read-only token before upload.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          private = temporary / ('psst-native-private-' + os.environ['ARCH'])
          public = temporary / 'candidate-records'
          public.mkdir(exist_ok=True)
          limit = 4 * 1024 * 1024
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def content(path, maximum=limit):
              require(path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= maximum, 'Invalid/oversized candidate record')
              return path.read_bytes()
          def checked_public(raw):
              json.loads(raw)
              for name in ['GH_TOKEN', 'GITHUB_TOKEN', 'RUNNER_TEMP', 'GITHUB_WORKSPACE', 'HOME']:
                  require(not os.environ.get(name) or os.environ[name].encode() not in raw, 'Record contains protected runner data')
              return raw
          def write(name, value):
              raw = json.dumps(value, sort_keys=True, indent=2).encode() + b'\n'
              require(len(raw) <= limit, 'Public candidate summary exceeds bound')
              (public / name).write_bytes(checked_public(raw))
          write('candidate-context.json', {
              'schema_version': 1, 'kind': 'read-only-candidate-context',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'version': os.environ['CANDIDATE_VERSION'], 'commit': os.environ['SOURCE_COMMIT'],
              'event': os.environ['GITHUB_EVENT_NAME'], 'ref': os.environ['GITHUB_REF'],
              'source_kind': os.environ['SOURCE_KIND'],
              'planned_candidate_only': os.environ['SOURCE_KIND'] == 'planned-main-dispatch',
              'tagged_source_ci_gate_verified': False, 'publication_authorized': False,
          })
          # Explicit file allowlist: never upload entire native/private trees.
          allowed = {
              'candidate-bases.json': temporary / 'candidate-inputs/candidate-bases.json',
              'native-artifacts.json': private / 'native/native-artifacts.json',
              'native-measurement.json': private / 'native/native-measurement.json',
              'smoke-report.json': private / 'native/smoke-report.json',
              'source-scan-measurement.json': private / 'source-scans/source-scan-measurement.json',
              'module-source-inventory.json': private / 'application-dependencies/source-inventory.json',
          }
          for name, path in allowed.items():
              if path.exists():
                  (public / name).write_bytes(checked_public(content(path)))
          for component in ['backend', 'web']:
              for name in ['measurement.json', 'scan.json']:
                  path = private / ('image-scan-' + component) / name
                  if path.exists():
                      # Same bound as the producer's complete scanner JSON.
                      # Copy exact bytes, including every reported finding.
                      (public / ('image-' + component + '-' + name)).write_bytes(checked_public(content(path, 16 * 1024 * 1024)))
          original = private / 'candidate-result.json'
          if original.exists():
              raw = content(original)
              value = json.loads(raw)
              write('build-summary.json', {
                  'schema_version': 1, 'kind': 'candidate-build-summary',
                  'original_record_sha256': 'sha256:' + hashlib.sha256(raw).hexdigest(),
                  'version': value['version'], 'source_commit': value['source_commit'],
                  'platform': value['checked_platform'], 'native_execution': value['native_execution'],
                  'base_images': value['base_images'], 'image_archive': value['image_archive'],
                  'build_metadata': {name: {key: record[key] for key in ['containerimage.config.digest', 'containerimage.digest']} for name, record in value['build_metadata'].items()},
                  'toolchain_output': {key: value['toolchain_output'][key] for key in ['go', 'node', 'docker', 'compose', 'buildx']},
                  'publication_authorized': False,
              })
          for component in ['backend', 'web']:
              path = private / ('compiler-' + component) / 'compiler-graph-measurement.json'
              if not path.exists():
                  continue
              raw = content(path)
              value = json.loads(raw)
              # Distinct summary kind: full raw receipts/graphs remain private;
              # this partial artifact cannot replay a later authenticated gate.
              summary = {key: value[key] for key in ['schema_version', 'source', 'execution', 'component', 'executable_target', 'builder', 'image', 'binary', 'source_graph', 'source_inputs', 'advisories', 'status', 'exit_code', 'completed_at', 'publication_authorized', 'finding_dispositions_authorized']}
              summary['kind'] = 'candidate-compiler-graph-summary'
              summary['original_measurement_sha256'] = 'sha256:' + hashlib.sha256(raw).hexdigest()
              proof = value['signature_verification']
              if proof:
                  summary['signature_verification'] = {key: item for key, item in proof.items() if key != 'verifications'}
                  summary['signature_verification']['checks'] = [{key: item[key] for key in ['artifact', 'sha256', 'certificate_sha256', 'signature_sha256', 'exit_code']} for item in proof['verifications']]
              write('compiler-' + component + '-summary.json', summary)
          PY
      - name: Remove only owned candidate payloads, helper and image aliases
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/psst-native-private-$ARCH" "$RUNNER_TEMP/candidate-inputs" "$RUNNER_TEMP/candidate-transfer/$ARCH" "$RUNNER_TEMP/common-npm-audit" "$RUNNER_TEMP/candidate-upstream"
          for image in "psst-candidate-backend:$ARCH" "psst-candidate-web:$ARCH" "psst-candidate-web-builder:$ARCH" "psst-candidate-source-helper:$ARCH"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: candidate-records-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-records/*.json
          if-no-files-found: error
          retention-days: 1

  assemble-candidate:
    name: Assemble both native candidate results
    needs: [validate-tag, ci, resolve-bases, upstream-inputs, build-and-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
      SOURCE_KIND: ${{ needs.validate-tag.outputs.source_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/bases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-inputs-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-inputs-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-images-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/amd64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-images-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/arm64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-upstream-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/upstream
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Assemble the planned candidate without publication authority
        if: needs.validate-tag.outputs.source_kind == 'planned-main-dispatch'
        run: |
          release_tool=$(sh tools/release/build.sh)
          inputs="$RUNNER_TEMP/candidate-assembly"
          for arch in amd64 arm64; do
            "$release_tool" container-build transfer verify \
              --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
              --commit "$SOURCE_COMMIT" --platform "linux/$arch" \
              --source-kind "$SOURCE_KIND" --transfer "$inputs/$arch"
          done
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
            --arg event_sha "$GITHUB_SHA" --arg reviewed_commit "$SOURCE_COMMIT" \
            --arg planned_version "$CANDIDATE_VERSION" --arg event_name "$GITHUB_EVENT_NAME" \
            --arg inputs "$inputs" '
            {
              repository: $repository, ref: $ref, event_sha: $event_sha,
              reviewed_commit: $reviewed_commit, planned_version: $planned_version,
              event_name: $event_name, candidate: ($inputs + "/bases/candidate-bases.json"),
              common_collection: ($inputs + "/upstream"), output: ($inputs + "/prepared"),
              cosign: "",
              migration_notes: "Stopped checkpoint required; preserve existing administrator and storage.",
              rollback_notes: "Restore the matching checkpoint into isolated storage before activation.",
              native: (["amd64", "arm64"] | map(. as $arch | {
                key: ("linux/" + $arch), value: {
                  build_record: ($inputs + "/" + $arch + "/native/build-record.json"),
                  measurement: ($inputs + "/" + $arch + "/native/native-measurement.json"),
                  runtime_collection: ($inputs + "/" + $arch + "/native/pack"),
                  module_collection: ($inputs + "/" + $arch + "/application-dependencies"),
                  source_scan: ($inputs + "/" + $arch + "/source-scans/source-scan-measurement.json"),
                  browser_capture: ($inputs + "/" + $arch + "/native/browser/browser-inputs.tar"),
                  browser_verification: ($inputs + "/" + $arch + "/native/browser/browser-verification.json"),
                  archives: {
                    backend: ($inputs + "/" + $arch + "/native/export/backend-" + $arch + ".oci.tar"),
                    web: ($inputs + "/" + $arch + "/native/export/web-" + $arch + ".oci.tar")
                  }
                }
              }) | from_entries)
            }' > "$inputs/assembly-options.json"
          "$release_tool" container-build assemble --inputs "$inputs/assembly-options.json"
          printf '%s\n' 'Both native pairs and retained sources assembled as a planned candidate. No tag, authenticated release result or publication authority was created.' >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate and evaluate the exact tagged native pairs once
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" evaluate \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --event-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate "$RUNNER_TEMP/candidate-assembly/bases/candidate-bases.json" \
            --common "$RUNNER_TEMP/candidate-assembly/upstream" \
            --amd64-inputs "$RUNNER_TEMP/candidate-assembly/amd64" \
            --arm64-inputs "$RUNNER_TEMP/candidate-assembly/arm64" \
            --prepared "$RUNNER_TEMP/candidate-assembly/prepared" \
            --output "$RUNNER_TEMP/candidate-source-review" \
            --caddy-go-image 'docker.io/library/golang@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c'
      - name: Attest completed source and native check reports
        id: source-attestation
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate-source-review/release-result.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Independently verify the signed source report without repeating its replay
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" github verify-file \
            --file "$RUNNER_TEMP/candidate-source-review/release-result.json" \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --revision "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          printf '%s\n' 'One authenticated result covers complete source, native image, notice and scanner checks for the exact tag attempt. Protected publication and recovery remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-source-review/release-result.json
            ${{ runner.temp }}/candidate-source-review/corresponding-source-evidence.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-prepared-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-assembly/prepared/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.validate-tag.outputs.source_kind == 'version-tag' && 7 || 1 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-recovery-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          # The six large publication source archives are not recovery inputs.
          path: |
            ${{ runner.temp }}/candidate-assembly/prepared/release-inputs.json
            ${{ runner.temp }}/candidate-assembly/prepared/release-manifest.json
            ${{ runner.temp }}/candidate-assembly/prepared/psst.zip-deployment-${{ needs.validate-tag.outputs.version }}.tar.gz
            ${{ runner.temp }}/candidate-assembly/prepared/backend-index.json
            ${{ runner.temp }}/candidate-assembly/prepared/web-index.json
          if-no-files-found: error
          retention-days: ${{ needs.validate-tag.outputs.source_kind == 'version-tag' && 7 || 1 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-recovery-binding-${{ github.run_id }}-${{ github.run_attempt }}
          # Aggregation authenticates source subjects through the completed
          # source gate; it does not download image/source payloads again.
          path: |
            ${{ runner.temp }}/candidate-assembly/prepared/release-inputs.json
            ${{ runner.temp }}/candidate-assembly/prepared/release-manifest.json
            ${{ runner.temp }}/candidate-assembly/prepared/psst.zip-deployment-${{ needs.validate-tag.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Remove only owned assembly input and output trees
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/candidate-assembly" "$RUNNER_TEMP/candidate-source-review" "$RUNNER_TEMP/candidate-check-reports"

  recovery-candidate:
    name: Native container recovery (${{ matrix.arch }})
    needs: [validate-tag, assemble-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
      SOURCE_KIND: ${{ needs.validate-tag.outputs.source_kind }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # Native source measurement addresses exact config blobs. Keep that store
      # contract explicit on this disposable daemon, without changing VPS storage.
      - name: Set up the native measurement Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.8.2
          channel: stable
          set-host: true
          daemon-config: |
            {
              "storage-driver": "overlay2",
              "features": {"containerd-snapshotter": false}
            }
      - name: Verify the native measurement Docker engine
        run: |
          # DOCKER_HOST binds the virtual default context and default Buildx
          # builder to the action's isolated socket, including later overlays.
          test -n "$DOCKER_HOST"
          docker context use default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = "$DOCKER_HOST"
          test "$(docker version --format '{{.Server.Version}}')" = '29.8.2'
          test "$(docker info --format '{{.Driver}}')" = 'overlay2'
          architecture="$(docker info --format '{{.Architecture}}')"
          case "$architecture" in
            x86_64) architecture=amd64 ;;
            aarch64) architecture=arm64 ;;
          esac
          test "$PLATFORM" = "linux/$architecture"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind != 'version-tag'
        with:
          name: candidate-native-inputs-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind != 'version-tag'
        with:
          name: candidate-native-inputs-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind != 'version-tag'
        with:
          name: candidate-native-images-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/amd64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind != 'version-tag'
        with:
          name: candidate-native-images-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/arm64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-recovery-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          name: candidate-native-descriptor-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/amd64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          name: candidate-native-descriptor-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/arm64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          name: candidate-native-images-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/${{ matrix.arch }}/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          name: candidate-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/source
      - name: Verify downloaded trees and measure real native update and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from generate_release_gate_reports import NativeSourceContext
          from github_release_evidence import GhEvidenceVerifier
          from measure_release_recovery import measure_recovery
          from release_artifacts import PLATFORMS, read_bounded_file, read_json, require
          root = Path(os.environ['GITHUB_WORKSPACE'])
          inputs = Path(os.environ['RUNNER_TEMP']) / 'candidate-recovery'
          version, commit, kind = [os.environ[key] for key in ['CANDIDATE_VERSION', 'SOURCE_COMMIT', 'SOURCE_KIND']]
          authentication = {}
          if kind == 'version-tag':
              authentication = {
                  'source_report': inputs / 'source/release-result.json',
                  'smoke_report': inputs / 'source/release-result.json',
                  'verifier': GhEvidenceVerifier(token=os.environ['GH_TOKEN'], run_id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])),
              }
          else:
              authentication = {'parent_foundation': inputs / 'prepared/release-inputs.json'}
          prepared = inputs / 'prepared'
          manifest = read_json(read_bounded_file(prepared / 'release-manifest.json'))
          result = measure_recovery(
              context=NativeSourceContext(os.environ['GITHUB_REPOSITORY'], version, commit, os.environ['PLATFORM']),
              natives={p: inputs / p.split('/')[1] / 'native/native-artifacts.json' for p in PLATFORMS},
              manifest=prepared / 'release-manifest.json', bundle=prepared / manifest['bundle']['name'],
              previous_source='2ed02af8a062bb3cc21a80a1503d31775dd6e5d8',
              output=inputs / 'recovery-measurement.json', root=root, **authentication,
          )
          require(result['publication_authorized'] is False and result['upgrade_recovery_gate_pending'] is True, 'Recovery measurement cannot authorize release')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Native upgrade, same-version reapply, pause preservation and isolated recovery completed.\n')
              summary.write('Public provenance, independent off-host provider recovery, browser/mobile flows and authenticated release gates remain pending.\n')
          PY
      - name: Attest completed native recovery for the version-tag attempt
        id: recovery-attestation
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate-recovery/recovery-measurement.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
        with:
          archive: true
          name: candidate-recovery-attestation-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.recovery-attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-recovery-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-recovery/recovery-measurement.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove only owned recovery input and terminal measurement files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/candidate-recovery"

  aggregate-recovery:
    name: Authenticate completed native recovery
    needs: [validate-tag, assemble-candidate, recovery-candidate]
    if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-recovery-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-descriptor-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/amd64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-descriptor-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/arm64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-recovery-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/amd64/recovery
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-recovery-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/arm64/recovery
      - name: Derive the gate from both authenticated terminal experiments
        run: |
          python3 tools/aggregate_release_recovery.py \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --version "$CANDIDATE_VERSION" --commit "$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --prepared "$RUNNER_TEMP/recovery-gate/prepared" \
            --source-report "$RUNNER_TEMP/recovery-gate/source/release-result.json" \
            --amd64-inputs "$RUNNER_TEMP/recovery-gate/amd64" \
            --arm64-inputs "$RUNNER_TEMP/recovery-gate/arm64" \
            --amd64-measurement "$RUNNER_TEMP/recovery-gate/amd64/recovery/recovery-measurement.json" \
            --arm64-measurement "$RUNNER_TEMP/recovery-gate/arm64/recovery/recovery-measurement.json" \
            --output "$RUNNER_TEMP/recovery-gate/upgrade-recovery.json"
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" publication-result \
            --previous-result "$RUNNER_TEMP/recovery-gate/source/release-result.json" \
            --recovery "$RUNNER_TEMP/recovery-gate/upgrade-recovery.json" \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/recovery-gate/release-result.json"
      - name: Attest the completed two-platform recovery report
        id: gate-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/recovery-gate/release-result.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Independently verify the signed gate without another experiment
        run: |
          release_tool=$(sh tools/release/build.sh)
          "$release_tool" github verify-file \
            --file "$RUNNER_TEMP/recovery-gate/release-result.json" \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --revision "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          printf '%s\n' 'One authenticated release result includes both native recovery experiments and all source/image checks for this exact tag attempt.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-gate/release-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Present the release for the single protected publication approval
        env:
          CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          printf '%s\n' "## Container release $CANDIDATE_VERSION" \
            "Source commit: $SOURCE_COMMIT" \
            'Both architectures passed source, image, smoke, notice and recovery checks.' \
            'Review the retained source report and prepared artifacts before approving the publication job.' \
            'One container-release environment approval authorizes publication. No comment is required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only owned recovery gate inputs and report
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/recovery-gate"

  publish:
    name: Publish verified immutable container release
    needs: [validate-tag, assemble-candidate, aggregate-recovery]
    if: github.event_name == 'push' && needs.validate-tag.outputs.source_kind == 'version-tag' && vars.CONTAINER_RELEASE_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-26.04
    # Publication reuses completed native payloads and the authenticated preparation checks.
    # Its network transfer budget is separate from ordinary source CI.
    timeout-minutes: 30
    environment:
      name: container-release
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.validate-tag.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build trusted release tooling once
        run: |
          release_tool=$(sh tools/release/build.sh)
          printf 'PSST_RELEASE=%s\n' "$release_tool" >> "$GITHUB_ENV"
      - name: Check protected publication settings before downloading payloads
        env:
          PSST_INITIALIZE_GHCR_PACKAGES: ${{ vars.PSST_INITIALIZE_GHCR_PACKAGES }}
          PSST_IMMUTABLE_INSPECTION_TOKEN: ${{ secrets.PSST_IMMUTABLE_INSPECTION_TOKEN }}
        run: |
          "$PSST_RELEASE" container-publish settings
      - name: Require trusted hosted transfer and attestation tools
        run: |
          command -v gh >/dev/null
          gh attestation verify --help >/dev/null
      - name: Build and install stable native Skopeo from pinned upstream source
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            build-essential git libgpgme-dev libassuan-dev libbtrfs-dev pkg-config
          build_root=$(mktemp -d "$RUNNER_TEMP/psst-skopeo.XXXXXX")
          trap 'sudo rm -rf -- "$build_root"' EXIT
          source_dir="$build_root/src/go.podman.io/skopeo"
          source_commit=77f3d92f861271c7cb9175afcf876017bcae9202 # v1.24.1
          git init --quiet "$source_dir"
          git -C "$source_dir" fetch --quiet --depth=1 \
            https://github.com/podman-container-tools/skopeo.git "$source_commit"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$source_commit"
          # Use upstream's native CGO build and install its container policy/config.
          # Ubuntu's packaged Skopeo is an older prerelease; static builds are unsupported.
          sudo env "PATH=$PATH" "GOPATH=$build_root" "GOCACHE=$build_root/cache" \
            CGO_ENABLED=1 GOTOOLCHAIN=local \
            make -C "$source_dir" DISABLE_DOCS=1 install
          skopeo --version
          test "$(skopeo --version)" = "skopeo version 1.24.1 commit: $source_commit"
          test -r /etc/containers/policy.json
          test -r /etc/containers/registries.d/default.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-prepared-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-inputs/prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-images-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-inputs/amd64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-native-images-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-inputs/arm64/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-inputs/recovery
      - name: Authenticate exact subjects for standard final provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          install -d -m 700 "$RUNNER_TEMP/publication-state"
          "$PSST_RELEASE" container-publish prepare \
            --inputs-root "$RUNNER_TEMP/publication-inputs" \
            --root "$GITHUB_WORKSPACE" --reviewed-commit "$SOURCE_COMMIT" \
            --state "$RUNNER_TEMP/publication-state" \
            --checksums "$RUNNER_TEMP/final-subject-checksums.txt"
      - name: Attest final files and image digests with standard provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/final-subject-checksums.txt
          push-to-registry: false
          create-storage-record: false
          show-summary: true
      - name: Publish after authenticating gates and syncing local mutation state
        id: publication
        env:
          PSST_INITIALIZE_GHCR_PACKAGES: ${{ vars.PSST_INITIALIZE_GHCR_PACKAGES }}
          GH_TOKEN: ${{ github.token }}
          PSST_IMMUTABLE_INSPECTION_TOKEN: ${{ secrets.PSST_IMMUTABLE_INSPECTION_TOKEN }}
        run: |
          umask 077
          install -d -m 700 "$RUNNER_TEMP/publication-state"
          "$PSST_RELEASE" container-publish publish \
            --inputs-root "$RUNNER_TEMP/publication-inputs" \
            --root "$GITHUB_WORKSPACE" --reviewed-commit "$SOURCE_COMMIT" \
            --state "$RUNNER_TEMP/publication-state"
      - name: Project bounded publication diagnostics without private details
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome || 'skipped' }}
        run: |
          "$PSST_RELEASE" container-publish diagnostics \
            --state "$RUNNER_TEMP/publication-state" \
            --repository "$GITHUB_REPOSITORY" --version "$CANDIDATE_VERSION" \
            --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --outcome "$PUBLICATION_OUTCOME" \
            --output "$RUNNER_TEMP/publication-diagnostics.json"
      - name: Retain small publication diagnostics when the runner remains available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-diagnostics.json
          archive: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified successful publication receipt
        if: success() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-state/${{ env.CANDIDATE_VERSION }}-publication-receipt.json
          archive: true
          if-no-files-found: error
          retention-days: 7
      - name: Remove local state only after verified publication and receipt upload
        if: success() && steps.publication.outcome == 'success'
        run: |
          test -f "$RUNNER_TEMP/publication-state/$CANDIDATE_VERSION-publication-receipt.json"
          test ! -L "$RUNNER_TEMP/publication-state/$CANDIDATE_VERSION-publication-receipt.json"
          # Successful anonymous release/image readbacks precede this receipt.
          # Private journals and snapshots are never workflow artifacts.
          rm -rf -- "$RUNNER_TEMP/publication-state"
          printf '%s\n' "Immutable container release $CANDIDATE_VERSION published with verified anonymous readback and a publication receipt." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only owned downloaded publication inputs and action checksum input
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/publication-inputs"
          rm -f -- "$RUNNER_TEMP/final-subject-checksums.txt"
          rm -f -- "$RUNNER_TEMP/publication-diagnostics.json"
          # Failed private state survives only for this runner lifetime. The
          # small diagnostics artifact does not retain or authorize replay of it.
