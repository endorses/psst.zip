name: Deploy published container release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published deployment-ready version (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # Do not run an older/tagged or arbitrary branch copy with environment secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Request the installed version-only updater over pinned SSH
        env:
          PSST_RELEASE_VERSION: ${{ inputs.version }}
          PSST_VPS_HOST: ${{ vars.VPS_HOST }}
          PSST_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PSST_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: python3 tools/request_production_deployment.py
