name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          working-directory: backend

      - name: Test
        run: go test -v -count=1 -race ./...

      - name: Build
        run: go build -o server ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: Type check
        run: npm run check

      - name: Integration tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Disposable administrator authentication lifecycle
        env:
          PSST_TEST_STATE_FILE: ${{ runner.temp }}/psst-admin-security-state.json
          PSST_TEST_BACKEND_PORT: "18789"
          PSST_TEST_BACKEND_URL: http://127.0.0.1:18789
        run: npm run test:browser -- tests/browser/admin-security-runtime.spec.ts

      - name: Build
        run: npm run build

  android:
    name: Android and shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble and test
        run: ./android/gradlew -p android :app:assembleDebug :shared:testDebugUnitTest --no-daemon
