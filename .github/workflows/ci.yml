name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_validation:
        description: Run every application check for a reusable release caller
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Reject sensitive files and oversized blobs
        run: python3 tools/check_repository.py files

      - name: Scan complete Git history
        run: python3 tools/check_repository.py history

      - name: Repository check regression tests
        run: |
          python3 -m unittest discover -s tools -p 'test_repository_checks.py' -v
          python3 -m unittest discover -s tools -p 'test_ci_change_scope.py' -v

      - name: Release artifact and Compose regression tests
        run: |
          python3 -m unittest discover -s tools -p 'test_release_*.py' -v
          python3 -m unittest discover -s tools -p 'test_native_release_preparation.py' -v
          python3 -m unittest discover -s tools -p 'test_native_browser_inputs.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_source_replay.py' -v

      - name: SQLite vendoring syntax regressions
        # Two tiny standard-library cases; no dependency downloads or generators.
        run: GOTOOLCHAIN=local GO111MODULE=off go test ./tools/sqlite_vendoring.go ./tools/sqlite_vendoring_test.go

      - name: Check distributed project licenses
        run: |
          cmp LICENSE backend/licenses/AGPL-3.0-only.txt
          cmp LICENSE web/static/licenses/AGPL-3.0-only.txt

      - name: Check native notice inputs and archive boundaries
        run: |
          python3 tools/generate_native_notices.py --check-inputs-only
          python3 -m unittest discover -s tools -p 'test_native_notices.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_notices.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_source_packaging.py' -v
          python3 -m unittest discover -s tools -p 'test_caddy_source_signatures.py' -v
          python3 tools/runtime-legal/verify.py
          python3 tools/runtime-legal/test_verify.py

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected application checks
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: python3 "$GITHUB_WORKSPACE/tools/select_ci_checks.py" --job backend --force-full "$FULL_VALIDATION" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      - name: Check dependency notices
        if: steps.scope.outputs.run == 'true'
        run: |
          go mod download
          python3 scripts/generate-third-party-notices.py --check

      - name: Test
        if: steps.scope.outputs.run == 'true'
        # Bound hangs while preserving race checks. Limit package concurrency
        # to avoid contention between SQLite-heavy packages.
        run: go test -v -count=1 -race -p 2 -timeout 10m ./...

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: go build -o server ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected application checks
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: python3 "$GITHUB_WORKSPACE/tools/select_ci_checks.py" --job web --force-full "$FULL_VALIDATION" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Check dependency notices
        if: steps.scope.outputs.run == 'true'
        run: node scripts/generate-third-party-notices.mjs --check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Type check
        if: steps.scope.outputs.run == 'true'
        run: npm run check

      - name: Integration tests
        if: steps.scope.outputs.run == 'true'
        run: npm test

      - name: Install browser
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: steps.scope.outputs.run == 'true'
        run: npm run test:browser

      - name: Disposable administrator authentication lifecycle
        if: steps.scope.outputs.run == 'true'
        env:
          # Keep Node's disposable database and state marker under the same root.
          TMPDIR: ${{ runner.temp }}
          PSST_TEST_STATE_FILE: ${{ runner.temp }}/psst-admin-security-state.json
          PSST_TEST_BACKEND_PORT: "18789"
          PSST_TEST_BACKEND_URL: http://127.0.0.1:18789
        run: npm run test:browser -- tests/browser/admin-security-runtime.spec.ts

      - name: Build
        if: steps.scope.outputs.run == 'true'
        env:
          REVISION: ${{ github.sha }}
        run: npm run build

      - name: Verify browser build inventory
        if: steps.scope.outputs.run == 'true'
        run: |
          proof_dir=$(mktemp -d "$RUNNER_TEMP/psst-browser-source.XXXXXX")
          trap 'rm -rf -- "$proof_dir"' EXIT
          python3 ../tools/measure_browser_source_inventory.py \
            --root . --output-directory build --version dev \
            --revision "$GITHUB_SHA" --output "$proof_dir/measurement.json"

  android:
    name: Android and shared module
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected application checks
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: python3 "$GITHUB_WORKSPACE/tools/select_ci_checks.py" --job android --force-full "$FULL_VALIDATION" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "27"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.scope.outputs.run == 'true'
        with:
          accept-android-sdk-licenses: false
          packages: ""
      - name: Install Android SDK packages
        if: steps.scope.outputs.run == 'true'
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-35
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          cache-provider: basic
      - name: Assemble and test
        if: steps.scope.outputs.run == 'true'
        run: ./android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest :shared:testAndroidHostTest --no-daemon
      - name: Verify actual resolved native dependency notices
        if: steps.scope.outputs.run == 'true'
        run: python3 tools/generate_native_notices.py --check

  ios:
    name: Native iOS app, extension and XCTest
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected application checks
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: python3 "$GITHUB_WORKSPACE/tools/select_ci_checks.py" --job ios --force-full "$FULL_VALIDATION" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "27"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.scope.outputs.run == 'true'
        with:
          accept-android-sdk-licenses: false
          packages: ""
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          cache-provider: basic
      - name: Prepare build tools
        if: steps.scope.outputs.run == 'true'
        run: |
          brew install xcodegen
          android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-35
          xcodebuild -version
          xcodegen --version
          java -version
      - name: Check sources and generate project
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 ios/scripts/check_sources.py
          cd ios
          xcodegen generate
      - name: Select installed iOS simulator
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          state = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True, timeout=30))
          devices = [device for runtime, entries in state["devices"].items()
                     if runtime == "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
                     for device in entries
                     if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("Install an iOS 27.0 simulator for Xcode 27.0")
          device = devices[0]
          # Let first boot overlap the Kotlin/Swift build instead of delaying XCTest.
          if device.get("state") != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device["udid"]], check=True, timeout=60)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f'PSST_IOS_SIMULATOR_ID={device["udid"]}\n')
          PY
      - name: Build app, embedded extension and XCTest products once
        if: steps.scope.outputs.run == 'true'
        working-directory: ios
        run: |
          xcodebuild -project Psst.xcodeproj -scheme Psst \
            -sdk iphonesimulator -configuration Debug \
            -destination "platform=iOS Simulator,id=$PSST_IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/psst-ios-derived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing
          test -d "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app/PlugIns/PsstShareExtension.appex"
          codesign --verify --strict "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app"
          codesign --verify --strict "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app/PlugIns/PsstShareExtension.appex"
      - name: Wait for selected simulator readiness
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import os, subprocess
          # First boot overlaps compilation; wait for readiness before XCTest.
          subprocess.run(
              ["xcrun", "simctl", "bootstatus", os.environ["PSST_IOS_SIMULATOR_ID"], "-b"],
              check=True, timeout=120,
          )
          PY
      - name: Run native XCTest suite
        if: steps.scope.outputs.run == 'true'
        # Leave time to upload diagnostics if simulator startup or a test stalls.
        timeout-minutes: 10
        working-directory: ios
        run: |
          xcodebuild -project Psst.xcodeproj -scheme Psst \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PSST_IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/psst-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/psst-ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test-without-building
      - name: Diagnose native startup or test failure
        if: failure() && steps.scope.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess, tempfile
          commands = [
              ["xcrun", "simctl", "list", "runtimes", "--json"],
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              ["log", "show", "--last", "3m", "--style", "compact", "--predicate",
               'process == "simdiskimaged" OR process == "CoreSimulatorService"'],
          ]
          for command in commands:
              print("Native diagnostic: " + " ".join(command), flush=True)
              # Spool output to a disposable file; emit only a bounded tail.
              with tempfile.TemporaryFile() as output:
                  try:
                      result = subprocess.run(command, stdout=output,
                          stderr=subprocess.STDOUT, timeout=10, check=False)
                      print(f"Exit status: {result.returncode}", flush=True)
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print(f"Diagnostic unavailable: {type(error).__name__}", flush=True)
                  output.seek(0, 2)
                  output.seek(max(0, output.tell() - 16384))
                  print(output.read().decode("utf-8", errors="replace"), flush=True)
          PY
      - name: Preserve native test results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: ios-native-test-results
          path: ${{ runner.temp }}/psst-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
