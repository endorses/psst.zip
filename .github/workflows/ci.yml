name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache: false

      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Reject sensitive files and oversized blobs
        run: python3 tools/check_repository.py files

      - name: Scan complete Git history
        run: python3 tools/check_repository.py history

      - name: Repository check regression tests
        run: python3 -m unittest discover -s tools -p 'test_repository_checks.py' -v

      - name: Release artifact and Compose regression tests
        run: python3 -m unittest discover -s tools -p 'test_release_*.py' -v

      - name: Check distributed project licenses
        run: |
          cmp LICENSE backend/licenses/AGPL-3.0-only.txt
          cmp LICENSE web/static/licenses/AGPL-3.0-only.txt

      - name: Check native notice inputs and archive boundaries
        run: |
          python3 tools/generate_native_notices.py --check-inputs-only
          python3 -m unittest discover -s tools -p 'test_native_notices.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_notices.py' -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0
          working-directory: backend

      - name: Check dependency notices
        run: |
          go mod download
          python3 scripts/generate-third-party-notices.py --check

      - name: Test
        # Real SQLite migrations and retention-boundary workloads are expensive
        # under race instrumentation. Keep all checks and give each package a
        # bounded budget with less contention between database-heavy packages.
        run: go test -v -count=1 -race -p 2 -timeout 30m ./...

      - name: Build
        run: go build -o server ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check dependency notices
        run: node scripts/generate-third-party-notices.mjs --check

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: backend/go.sum

      - name: Type check
        run: npm run check

      - name: Integration tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Disposable administrator authentication lifecycle
        env:
          # Keep Node's disposable database and state marker under the same root.
          TMPDIR: ${{ runner.temp }}
          PSST_TEST_STATE_FILE: ${{ runner.temp }}/psst-admin-security-state.json
          PSST_TEST_BACKEND_PORT: "18789"
          PSST_TEST_BACKEND_URL: http://127.0.0.1:18789
        run: npm run test:browser -- tests/browser/admin-security-runtime.spec.ts

      - name: Build
        run: npm run build

  android:
    name: Android and shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Assemble and test
        run: ./android/gradlew -p android :app:assembleDebug :shared:testDebugUnitTest --no-daemon
      - name: Verify actual resolved native dependency notices
        run: python3 tools/generate_native_notices.py --check

  ios:
    name: Native iOS app, extension and XCTest
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Prepare build tools
        run: |
          brew install xcodegen
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          xcodebuild -version
          xcodegen --version
          java -version
      - name: Check sources and generate project
        run: |
          python3 ios/scripts/check_sources.py
          cd ios
          xcodegen generate
      - name: Select installed iOS simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          state = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True))
          devices = [device for runtime, entries in state["devices"].items()
                     if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-26-0")
                     for device in entries
                     if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("Install an iOS 26.0 simulator for the selected Xcode toolchain")
          device = devices[0]
          # Let first boot overlap the Kotlin/Swift build instead of delaying XCTest.
          if device.get("state") != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device["udid"]], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f'PSST_IOS_SIMULATOR_ID={device["udid"]}\n')
          PY
      - name: Build app, embedded extension and XCTest products once
        working-directory: ios
        run: |
          xcodebuild -project Psst.xcodeproj -scheme Psst \
            -sdk iphonesimulator -configuration Debug \
            -destination "platform=iOS Simulator,id=$PSST_IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/psst-ios-derived" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual build-for-testing
          test -d "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app/PlugIns/PsstShareExtension.appex"
          codesign --verify --strict "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app"
          codesign --verify --strict "$RUNNER_TEMP/psst-ios-derived/Build/Products/Debug-iphonesimulator/Psst.app/PlugIns/PsstShareExtension.appex"
      - name: Run native XCTest suite
        working-directory: ios
        run: |
          xcodebuild -project Psst.xcodeproj -scheme Psst \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PSST_IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/psst-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/psst-ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test-without-building
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-native-test-results
          path: ${{ runner.temp }}/psst-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
