name: CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing client/vX.Y.Z tag from reviewed main
        required: true
        type: string
      publish:
        description: Publish a new immutable release after reviewing the candidate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  source:
    name: Verify exact CLI source and executed CI
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
      ci_run: ${{ steps.source.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag ancestry and successful executed source checks
        id: source
        env:
          CLI_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          def run(*args):
              return subprocess.check_output(args, text=True, timeout=30).strip()

          def api(path):
              return json.loads(run('gh', 'api', path))

          tag = os.environ['CLI_TAG']
          if os.environ['GITHUB_REF'] != 'refs/heads/main' or not re.fullmatch(r'client/v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', tag):
              raise SystemExit('Dispatch from main with an existing stable client/vX.Y.Z tag.')
          if run('git', 'rev-parse', 'HEAD') != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatcher source identity mismatch.')
          revision = run('git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}')
          subprocess.run(['git', 'merge-base', '--is-ancestor', revision, 'HEAD'], check=True, timeout=10)
          repository = os.environ['GITHUB_REPOSITORY']
          required = {
              'Repository security': {'Scan complete Git history', 'Repository check regression tests'},
              'Go client and CLI': {'Vet Go client', 'Client and CLI race tests', 'Build and smoke-test CLI executable once', 'Check resolved CLI dependency notices', 'Disposable backend and browser crypto interoperability'},
          }
          if subprocess.run(['git', 'cat-file', '-e', revision + ':client/internal/lan/session.go'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=10).returncode == 0:
              required['Go client and CLI'].update({'Prepare matching embedded LAN browser assets', 'Embedded LAN Send and Receive browser interoperability'})
          eligible = None
          for page in range(1, 6):
              runs = api(f'repos/{repository}/actions/workflows/ci.yml/runs?head_sha={revision}&status=success&per_page=100&page={page}')['workflow_runs']
              for candidate in runs:
                  if candidate['event'] not in {'push', 'workflow_dispatch'} or candidate['head_sha'] != revision or candidate['head_branch'] != 'main' or candidate['conclusion'] != 'success':
                      continue
                  jobs = api(f"repos/{repository}/actions/runs/{candidate['id']}/attempts/{candidate['run_attempt']}/jobs?per_page=100")['jobs']
                  passed = {}
                  for job in jobs:
                      if job['name'] not in required or job['conclusion'] != 'success':
                          continue
                      steps = {step['name'] for step in job['steps'] if step['conclusion'] == 'success' and step.get('started_at') and step.get('completed_at')}
                      passed[job['name']] = required[job['name']] <= steps
                  if all(passed.get(name) for name in required):
                      eligible = candidate['id']
                      break
              if eligible is not None or len(runs) < 100:
                  break
          if eligible is None:
              raise SystemExit('Exact tagged source needs successful, executed CLI and security checks on main; skipped checks are insufficient. Run CI on that exact main revision with cli_only=true, then retry this candidate workflow.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\nversion={tag.removeprefix("client/v")}\nci_run={eligible}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'CLI source `{revision}` reuses executed checks in CI run {eligible}. No application suites are rerun for packaging.\n')
          PY

  build:
    name: Package reviewed CLI source once
    needs: source
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install matching browser build dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build release archives, corresponding source and notices
        env:
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
        run: |
          started=$SECONDS
          if [ -f tools/release/build.sh ]; then
            tool=$(sh tools/release/build.sh)
            "$tool" cli-package --version "$VERSION" --revision "$REVISION" --output "$RUNNER_TEMP/cli-release"
          else
            # Only immutable pre-migration source tags use their original helper.
            python3 client/scripts/package-release.py --version "$VERSION" --revision "$REVISION" --output "$RUNNER_TEMP/cli-release"
          fi
          printf 'CLI six-target packaging and source/notices: %ss\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test packaged Linux executable and offline QR
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/cli-installed"
          tar -xzf "$RUNNER_TEMP/cli-release/psst-$VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/cli-installed"
          binary="$RUNNER_TEMP/cli-installed/psst-$VERSION-linux-amd64/psst"
          "$binary" --version
          "$binary" qr --json-file client/examples/send.json > "$RUNNER_TEMP/cli-installed/qr.txt"
          test -s "$RUNNER_TEMP/cli-installed/qr.txt"
          cd "$RUNNER_TEMP/cli-release"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish new immutable CLI release
    if: ${{ inputs.publish }}
    needs: [source, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release
      - name: Refuse existing releases and changed tags, then publish exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
        run: |
          cd "$RUNNER_TEMP/cli-release"
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.parse import quote

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True, timeout=30))

          repository, tag = os.environ['GITHUB_REPOSITORY'], os.environ['CLI_TAG']
          # Inspect every release, including drafts; no overwrite or draft reuse.
          for page in range(1, 101):
              releases = api(f'repos/{repository}/releases?per_page=100&page={page}')
              if any(release['tag_name'] == tag for release in releases):
                  raise SystemExit('This tag already has a release; existing releases are never replaced.')
              if len(releases) < 100:
                  break
          else:
              raise SystemExit('Release listing exceeded its inspection bound.')
          ref = api(f'repos/{repository}/git/ref/{quote("tags/" + tag, safe="")}')['object']
          for unused in range(8):
              if ref['type'] == 'commit':
                  break
              if ref['type'] != 'tag':
                  raise SystemExit('Unsupported tag target.')
              ref = api(f"repos/{repository}/git/tags/{ref['sha']}")['object']
          if ref['type'] != 'commit' or ref['sha'] != os.environ['REVISION']:
              raise SystemExit('Selected tag changed after source verification.')
          record = json.load(open('cli-release.json'))
          if record['revision'] != ref['sha'] or record['version'] != os.environ['VERSION'] or record['development_only'] or record['source_dirty']:
              raise SystemExit('Publication candidate identity or clean-source verification failed.')
          PY
          printf 'psst.zip CLI %s\n\nReviewed source: %s\n\nPlatform archives contain licenses and installation instructions. SHA256SUMS covers every release asset; the source archive includes vendored dependencies.\n' "$VERSION" "$REVISION" > "$RUNNER_TEMP/cli-notes.md"
          gh release create "$CLI_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "psst.zip CLI $VERSION" --notes-file "$RUNNER_TEMP/cli-notes.md"
          gh release edit "$CLI_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.parse import quote

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True, timeout=30))

          repository, tag = os.environ['GITHUB_REPOSITORY'], os.environ['CLI_TAG']
          release = api(f'repos/{repository}/releases/tags/{quote(tag, safe="")}')
          if release.get('tag_name') != tag or release.get('draft') is not False or release.get('immutable') is not True:
              raise SystemExit('Published release identity, visibility or immutability was not confirmed.')
          ref = api(f'repos/{repository}/git/ref/{quote("tags/" + tag, safe="")}')['object']
          for unused in range(8):
              if ref['type'] == 'commit':
                  break
              if ref['type'] != 'tag':
                  raise SystemExit('Unsupported published tag target.')
              ref = api(f"repos/{repository}/git/tags/{ref['sha']}")['object']
          if ref['type'] != 'commit' or ref['sha'] != os.environ['REVISION']:
              raise SystemExit('Published immutable tag does not match the reviewed source revision.')
          PY
