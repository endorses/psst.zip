name: CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing client/vX.Y.Z tag from reviewed main
        required: true
        type: string
      publish:
        description: Publish a new immutable release after reviewing the candidate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  source:
    name: Verify exact CLI source and executed CI
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
      ci_run: ${{ steps.source.outputs.ci_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      - name: Validate tag ancestry and successful executed source checks
        id: source
        env:
          CLI_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tool=$(sh tools/release/build.sh)
          "$tool" github cli-source --tag "$CLI_TAG"

  build:
    name: Package reviewed CLI source once
    needs: source
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install matching browser build dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build release archives, corresponding source and notices
        env:
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
        run: |
          started=$SECONDS
          if [ -f tools/release/build.sh ]; then
            tool=$(sh tools/release/build.sh)
            "$tool" cli-package --version "$VERSION" --revision "$REVISION" --output "$RUNNER_TEMP/cli-release"
          else
            # Only immutable pre-migration source tags use their original helper.
            python3 client/scripts/package-release.py --version "$VERSION" --revision "$REVISION" --output "$RUNNER_TEMP/cli-release"
          fi
          printf 'CLI six-target packaging and source/notices: %ss\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test packaged Linux executable and offline QR
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/cli-installed"
          tar -xzf "$RUNNER_TEMP/cli-release/psst-$VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/cli-installed"
          binary="$RUNNER_TEMP/cli-installed/psst-$VERSION-linux-amd64/psst"
          "$binary" --version
          "$binary" qr --json-file client/examples/send.json > "$RUNNER_TEMP/cli-installed/qr.txt"
          test -s "$RUNNER_TEMP/cli-installed/qr.txt"
          cd "$RUNNER_TEMP/cli-release"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish new immutable CLI release
    if: ${{ inputs.publish }}
    needs: [source, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: tools/release/go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release
      - name: Publish exact assets after draft byte readback
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
        run: |
          tool=$(sh tools/release/build.sh)
          "$tool" github cli-publish --tag "$CLI_TAG" --version "$VERSION" --revision "$REVISION" \
            --artifacts "$RUNNER_TEMP/cli-release" --receipt "$RUNNER_TEMP/cli-publication-receipt.json"
      - name: Retain bounded publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 30
