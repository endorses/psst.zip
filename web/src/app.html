<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="psst-web" content="1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" sizes="any" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <title>psst.zip</title>
    <script>
      // Apply the saved appearance before styles render to avoid a theme flash.
      try {
        const appearance = localStorage.getItem("psst.theme");
        document.documentElement.dataset.theme =
          appearance === "light" || appearance === "dark" ? appearance : "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-prerender="false">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
