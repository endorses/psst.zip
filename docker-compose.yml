services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      STORAGE_PATH: /app/data/files
      DB_PATH: /app/data/psst.db
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-5368709120}"
      DEFAULT_EXPIRY: "${DEFAULT_EXPIRY:-24h}"
      CLEANUP_INTERVAL: "${CLEANUP_INTERVAL:-5m}"
    volumes:
      - psst-data:/app/data

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PSST_DOMAIN: "${PSST_DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  psst-data:
  caddy-data:
  caddy-config:
